<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Partite</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f2020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Partite">

  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ro">
<div class="sticky-top-wrap">
  <header>
    <div class="title-with-sync">
      <h1>Partite</h1>
      <button id="conflictAlertBtn" type="button" class="alert-btn-standalone status-ok" title="Stato partite: tutto regolare">✓</button>

      <div id="syncIndicatorWrap" class="sync-indicator-wrap">
        <span id="syncDot" class="sync-dot sync-green" title="Pronto"></span>
        <button id="quickSaveBtn" class="pill-btn-sm auth-only" title="Salva modifiche sul cloud (Ctrl+S)">💾 Salva</button>
        <button id="quickPullBtn" class="pill-btn-sm" title="Aggiorna dal cloud">↻</button>
      </div>
    </div>

    <div class="top-actions">
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      
      <button id="authBtn" type="button" class="auth-btn" onclick="handleAuthClick()">🔒 Accedi</button>
      <button id="add" type="button" class="primary auth-only">+ Partita</button>
      <button id="todayBtn" type="button" title="Vai a oggi">Oggi</button>
      <button id="undoBtn" type="button" class="auth-only" title="Annulla ultima modifica (Ctrl+Z)">↺</button>

      <div class="menuWrap">
        <button id="gearBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Impostazioni">⚙️</button>
        <div class="menuDrop" id="gearDrop" role="menu" hidden>
          <button id="themeBtn" type="button" role="menuitem">🎨 Tema / Stile</button>
          <button id="notifyBtn" type="button" role="menuitem">🔔 Abilita Notifiche</button>
          <button id="exportMultiJsonBtn" type="button" role="menuitem">📤 Esporta JSON (Mesi)</button>
          <button id="importBtn" type="button" class="auth-only" role="menuitem">📥 Importa JSON</button>
          <button id="pdfImportBtn" type="button" class="auth-only" role="menuitem">📄 Importa da PDF</button>
          <button id="changePinBtn" type="button" class="auth-only" role="menuitem">🔑 Cambia Password Admin</button>
        </div>
      </div>
      <div class="menuWrap">
        <button id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Menu">☰</button>
        <div class="menuDrop" id="menuDrop" role="menu" hidden>
          <button id="resocontoBtn" type="button" role="menuitem">📊 Resoconto Compensi</button>
          <button id="shareLinkBtn" type="button" role="menuitem">🔗 Copia Link Calendario</button>
          <button id="printBtn" type="button" role="menuitem">🖨️ Stampa PDF</button>
          <button id="namesBtn" type="button" class="auth-only" role="menuitem">👥 Gestione Nomi</button>
          <button id="catBtn" type="button" class="auth-only" role="menuitem">🏷️ Gestione Categorie</button>
        </div>
      </div>
    </div>
  </header>

  <div class="filterBar">
    <select id="filterCat"><option value="">Tutte le categorie</option></select>
    <button id="filterIncomplete" type="button" aria-pressed="false">Incomplete <span id="incCount" style="opacity:.75"></span></button>
    <button class="waBtn" id="waTodayBtn" type="button" title="Copia turni dei prossimi 7 giorni">📲 WA Prossimi 7gg</button>
  </div>
</div>

<main>
  <datalist id="namesList"></datalist>
  <datalist id="categoriesList"></datalist>
  <div class="robanner" id="roBanner">Modalità sola lettura: tocca "Accedi" per abilitare le modifiche.</div>

  <div id="list"></div>
</main>
<div id="msg" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
