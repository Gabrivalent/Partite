<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Partite - Gestione Turni</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#131415">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- STILI MODULARI -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modals.css">

  <!-- LIBRERIE ESTERNE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <!-- BACKDROP MOBILE -->
    <div class="nav-backdrop" id="navBackdrop"></div>

    <!-- SIDEBAR / RAIL LATERALE -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-top">
        <button type="button" class="rail-icon-btn" id="sidebarToggleBtn" title="Espandi / Comprimi menu">☰</button>
        <span class="sidebar-brand-label">🏀 Turni Basket</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="rail-nav-item active" id="railNavHome">
          <span class="icon">📅</span>
          <span class="label">Partite</span>
        </button>
        <button type="button" class="rail-nav-item" id="railNavResoconto">
          <span class="icon">📊</span>
          <span class="label">Compensi</span>
        </button>
      </nav>

      <!-- ALBERO ANNI/MESI/SETTIMANE -->
      <div class="sidebar-tree-container">
        <div class="sidebar-section-title">Calendario</div>
        <div id="navTree"></div>
      </div>

      <div class="sidebar-bottom">
        <button type="button" class="rail-nav-item" id="railNavSettings" title="Impostazioni">
          <span class="icon">⚙️</span>
          <span class="label">Impostazioni</span>
        </button>

        <div class="rail-sync-wrap">
          <span id="syncDot" class="sync-dot sync-green" title="Stato sincronizzazione"></span>
          <span id="syncText" class="sync-text-status">Connesso</span>
        </div>

        <button type="button" class="rail-auth-btn" id="authBtn" title="Accesso Amministratore">
          <span class="icon">🔒</span>
          <span class="label">Accedi</span>
        </button>
      </div>
    </aside>

    <!-- WRAPPER CONTENUTO PRINCIPALE -->
    <div class="app-content-wrapper">
      <!-- TOP BAR -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
          <h1 class="page-title">Partite</h1>
        </div>

        <div class="top-bar-actions">
          <button type="button" id="conflictAlertBtn" class="alert-btn-standalone status-ok" title="Stato calendario">✓</button>
          <button type="button" class="pill-btn-action" id="todayBtn">Oggi</button>
          <button type="button" class="btn-primary-action auth-only" id="add">+ Partita</button>
          <button type="button" class="pill-btn-sm auth-only" id="undoBtn" title="Annulla ultima modifica" disabled>↺</button>
          <button type="button" class="pill-btn-sm auth-only" id="quickSaveBtn" title="Salva su cloud">💾</button>
          <button type="button" class="pill-btn-sm" id="quickPullBtn" title="Ricarica da cloud">🔄</button>
        </div>
      </header>

      <!-- STRISCIA FILTRI E RICERCA -->
      <div class="filter-strip">
        <div class="search-wrap">
          <input type="search" id="searchFilter" placeholder="Cerca squadre, ruoli...">
        </div>
        <select id="filterCat">
          <option value="">Tutte le categorie</option>
        </select>
        <button type="button" class="filter-chip" id="filterIncomplete" aria-pressed="false">
          Incomplete <span id="incCount"></span>
        </button>
        <button type="button" class="waBtn" id="waTodayBtn" title="Copia turni dei prossimi 7 giorni">📲 WA 7gg</button>
      </div>

      <!-- AREA CONTENUTO PARTITE E RIEPILOGO -->
      <main class="content-scroll" id="mainContent">
        <div id="list"></div>
      </main>
    </div>
  </div>

  <!-- NOTIFICA TOAST -->
  <div id="msg" role="status" aria-live="polite"></div>

  <!-- DATALIST PER AUTOCOMPLETAMENTO -->
  <datalist id="namesList"></datalist>
  <datalist id="categoriesList"></datalist>
  <input type="file" id="importFile" accept="application/json" style="display:none">

  <!-- SCRIPT APPLICAZIONE -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
